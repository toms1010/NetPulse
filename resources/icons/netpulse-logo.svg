<?xml version="1.0" encoding="UTF-8"?>
<!--
  NetPulse horizontal lockup: the icon badge beside the wordmark.
  Used in the sidebar brand row and the About page.

  The wordmark is drawn as paths rather than <text> so it renders identically
  everywhere without depending on a particular font being installed.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="560" height="128" viewBox="0 0 140 32">
  <g>
    <rect x="1" y="1" width="30" height="30" rx="8" fill="#0F172A"/>
    <rect x="1.75" y="1.75" width="28.5" height="28.5" rx="7.25"
          fill="none" stroke="#10b981" stroke-opacity="0.55" stroke-width="1.5"/>
    <path d="M6 16h4.2l2.6-6.4 3.4 12.8 2.6-6.4H26"
          fill="none" stroke="#10b981" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark. Each glyph is a stroked path on a 10-unit advance, drawn with
       a 2.1 stroke and round joins to match the mark's weight. -->
  <g fill="none" stroke="#10b981" stroke-width="2.1"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- N -->
    <path d="M40 24V8l8 16V8"/>
    <!-- e -->
    <path d="M52 18h7a3.5 3.5 0 0 0-7 0v2a3.5 3.5 0 0 0 3.5 3.5h3.5"/>
    <!-- t -->
    <path d="M68 11v10a3 3 0 0 0 3 3M64.5 15h7"/>
    <!-- P -->
    <path d="M78 24V8h5a4 4 0 0 1 0 8h-5"/>
    <!-- u -->
    <path d="M92 11v9a3.5 3.5 0 0 0 7 0v-9"/>
    <!-- l -->
    <path d="M105 8v16"/>
    <!-- s -->
    <path d="M119 11.5a3 3 0 0 0-5 1.2c0 2 5 1.8 5 4 0 1.6-2.2 2.4-5 1.3"/>
    <!-- e -->
    <path d="M123 18h7a3.5 3.5 0 0 0-7 0v2a3.5 3.5 0 0 0 3.5 3.5h3.5"/>
  </g>
</svg>